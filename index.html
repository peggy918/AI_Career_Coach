<!DOCTYPE html>
<html lang="zh-Hant">

<style>

main{max-width:1040px;margin:auto;padding:4px 16px 96px}

.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 16px;font:inherit;cursor:pointer;font-weight:600}

.kcol{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:10px;min-height:110px}

.ps{flex:none;display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px 5px 5px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.ps .pn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:12px;font-weight:700}

.tbw{overflow-x:auto}

.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}.tl>div{position:relative;margin-bottom:12px}.tl>div:before{content:"";position:absolute;left:-23px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.tr{font-size:13px;margin:3px 0}.tr b{color:var(--ac2)}
.stp{background:var(--bg);border-radius:12px;padding:12px;font-size:14px}.pn2{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;margin-right:6px;font-size:13px}
.lk{display:grid;grid-template-columns:1fr repeat(5,34px);gap:2px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}.lk label{margin:0;text-align:center;color:var(--ink)}.lk input{width:auto}
.login{max-width:420px;margin:12vh auto;text-align:center}.login h1{margin:0}.login p{color:var(--mut)}
.gbtn{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;background:#fff;color:#3c4043;border:1px solid #dadce0;border-radius:999px;padding:10px;font:inherit;font-weight:600;cursor:pointer;margin-top:16px}
.gbtn b{font-size:18px;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);-webkit-background-clip:text;background-clip:text;color:transparent}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:9;padding:16px}.ov>.card{width:100%;max-width:380px;margin:0;text-align:left}
.acc{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer}.acc:hover{background:var(--soft)}
.nb{display:inline-block;font-size:11px;font-weight:700;background:var(--nw);color:#fff;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle;cursor:pointer;line-height:18px;white-space:nowrap}
.nwc{outline:2px dashed var(--nw);outline-offset:3px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--nw);color:#fff;border:0;border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
.cli{padding:10px 12px;border-radius:10px;margin-top:8px;border:1px solid var(--line)}.cli.sel{border-color:var(--nw);box-shadow:0 0 0 2px rgba(47,111,214,.25)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:20;display:none;max-width:90vw}
#net{position:fixed;top:0;left:0;right:0;background:var(--warn);color:#fff;text-align:center;padding:6px 12px;font-size:13px;z-index:20;display:none}
svg text{fill:var(--mut);font-size:11px}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div><div id="net"></div>
<script>
/* ===== 常數 ===== */
const KV="cc_v3_",$=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10),uid=()=>"x"+Math.random().toString(36).slice(2,9);
const ST=["準備中","面試中","等待結果","已結案"],STEPS=["履歷診斷","模擬面試","面試報告","弱點特訓","成長追蹤","面試復盤"];
const COMP=["成就經驗","跨部門合作","衝突處理","失敗經驗","領導帶人","職涯動機"];
const T2C={"自我介紹":"成就經驗","量化成果":"成就經驗","專業能力":"成就經驗","跨部門溝通":"跨部門合作","動機與地雷題":"職涯動機"};
const KW=["SQL","Python","數據","專案","溝通","儀表板","分析","時程","預算","風險","協調","研究","Excel","簡報","行銷","使用者"];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,HAS_TTS=!!window.speechSynthesis;
const SC="・3 年專案管理經驗，負責跨部門需求整合\n・使用 Excel 與 Python 製作營運報表\n・主導網站改版專案，與設計、工程團隊協作";
const SUS=["我想我會經常使用這個系統","我覺得這個系統過於複雜","我覺得這個系統很容易使用","我想我需要技術人員協助才能使用這個系統","我覺得這個系統的各項功能整合得很好","我覺得這個系統有太多不一致的地方","我想大部分的人都能很快學會使用這個系統","我覺得這個系統用起來很笨拙","使用這個系統時我很有信心","我需要先學很多東西才能開始使用這個系統"];
const DIMS=["具體性","量化數據","結構","切題"];
const CL=[null,
{t:"流程引導",b:"專案內六個分頁可任意跳，不知道先做哪個",a:"頂端進度條標示每一步是否完成，並提示建議下一步；每頁底部有「下一步」按鈕",w:"任一專案頁的頂端與底部"},
{t:"履歷建議可套用",b:"AI 改寫建議只能看，要自己回去改",a:"每條建議可套用、略過或先修改再套用，一鍵產生新版履歷，之後的模擬面試依新版出題",w:"專案 → ① 履歷診斷"},
{t:"評分有依據",b:"只顯示分數，看不出為什麼",a:"依四項標準（具體性、量化數據、結構、切題）各 25 分評分，並引用你的原句說明扣分原因",w:"專案 → ③ 面試報告 → 弱點分析"},
{t:"特訓後驗證進步",b:"特訓重練會直接幫面試加分",a:"特訓分數只供練習；需再做一次完整面試，題型平均達 70 分才標示「已改善」",w:"④ 弱點特訓、⑤ 成長追蹤、首頁弱點標籤"},
{t:"面試前準備",b:"按下開始就直接出題",a:"麥克風測試、規則說明、面試官風格選擇；面試中可暫停或提前結束",w:"專案 → ② 模擬面試"},
{t:"隱私與同意",b:"沒有說明資料用途",a:"首次使用需閱讀並同意資料使用說明；可撤回研究同意或刪除所有資料",w:"登入後的同意頁、首頁「隱私與資料」"},
{t:"故事庫與面試連動",b:"故事庫只是存放區",a:"弱點分析會建議用哪個故事回答；故事有能力類別，並顯示涵蓋與缺口",w:"弱點分析、首頁故事庫"},
{t:"新使用者空狀態",b:"一登入就看到示範資料，容易誤會是自己的",a:"新帳號是空白並有三步驟引導；範例資料可另外載入與清除",w:"首頁"},
{t:"收集測試資料",b:"受試者資料留在各自瀏覽器，無法分析",a:"記錄操作事件、完成步驟與用時，提供 SUS 易用性問卷與匿名匯出",w:"首頁「研究資料」、面試報告的問卷邀請"},
{t:"真實面試結果回饋",b:"復盤只能記下題目",a:"記錄關卡與結果（自動更新看板狀態），題目加入題庫並出現在下一次模擬面試",w:"專案 → ⑥ 面試復盤、② 模擬面試的題目來源"},
{t:"錯誤與相容性處理",b:"不支援語音、沒權限或斷線時沒有提示",a:"自動偵測並改用文字輸入；麥克風權限與斷線提示；未完成的面試可從中斷處接續",w:"② 模擬面試的環境檢查、畫面頂端斷線提示"}];

/* ===== 狀態 ===== */
let U=null,D=null,V={v:"home"},I=null,rc=null;
const UI={chooser:false,cl:null,showNew:true,form:false,ov:null,sus:false,sty:"親切",tts:true,carry:true,dres:{},dans:{}};
try{UI.showNew=localStorage.getItem(KV+"shownew")!=="0"}catch(e){}
function blank(){return{consent:"",research:false,proj:[],rec:[],cv:[],st:[],ev:[],sus:null,live:null,sample:false}}
function boot(){try{const s=JSON.parse(localStorage.getItem(KV+"session")||"null");if(s&&s.mail){U=s;D=JSON.parse(localStorage.getItem(KV+"u_"+s.mail)||"null")||blank()}}catch(e){U=null;D=null}}
function save(){if(!U||!D)return;try{localStorage.setItem(KV+"u_"+U.mail,JSON.stringify(D));localStorage.setItem(KV+"session",JSON.stringify(U))}catch(e){}}
function logEv(e,x){if(D&&D.research)D.ev.push(Object.assign({t:new Date().toISOString(),e},x||{}))}
const P=id=>D.proj.find(p=>p.id===id);
const simRecs=p=>D.rec.filter(r=>r.pid===p.id&&r.type==="模擬");
const sessions=p=>simRecs(p).filter(r=>r.res&&r.res.length).reverse();
const curS=p=>{const ss=sessions(p);return ss.find(r=>r.id===V.rs)||ss[0]};
const cvName=p=>{const c=p.cvId&&D.cv.find(x=>x.id===p.cvId);return c?c.name:(p.cvText?"未存成版本的履歷":"尚未提供履歷")};
const mmss=t=>String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
const cut=(s,n)=>{n=n||28;return!s?"":s.length>n?s.slice(0,n)+"⋯":s};
function NB(n){return UI.showNew?`<span class="nb" data-a="cl" data-i="${n}" title="本版新增：${CL[n].t}">新 ${n}</span>`:""}
function NC(){return UI.showNew?" nwc":""}
function toast(t){const e=$("#toast");if(!e)return;e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>{e.style.display="none"},4500)}

/* ===== AI 示範邏輯（正式版由後端呼叫 AI） ===== */
function matchOf(jd,cv){const l=s=>(s||"").toLowerCase(),h=KW.filter(k=>l(jd).includes(l(k))),c=h.filter(k=>l(cv).includes(l(k)));return{match:h.length?Math.round(40+55*c.length/h.length):60,gaps:h.filter(k=>!c.includes(k))}}
function diagnose(p,cv){const m=matchOf(p.jd,cv);return{match:m.match,gaps:m.gaps,pq:[...m.gaps.slice(0,2).map(g=>`請說明你在「${g}」方面的實際經驗與成果`),"你如何量化自己的工作成果？","舉一個跨部門意見不同、你如何取得共識的例子"]}}
function suggest(cv,gaps){const R=[[/協作|合作|整合|跨部門/,"主導設計、工程、客服 3 個團隊的需求整合，專案提前 2 週上線，轉換率提升 15%"],[/報表|Excel|Python|自動化/,"以 Python 自動化 5 份週報，每月節省約 20 小時人工整理"],[/專案|管理|規劃/,"負責 8 個專案的時程與風險管理，準時交付率 95%"]],out=[];
(cv||"").split("\n").forEach((l,li)=>{const t=l.replace(/^[・•\-\s]+/,"").trim();if(!t||/\d/.test(t))return;const r=R.find(x=>x[0].test(t));out.push({li,o:t,n:r?r[1]:t+"，成果：（請補上具體數字，例如提升 15%）",st:""})});
(gaps||[]).slice(0,2).forEach(g=>out.push({li:-1,o:"（新增一行）",n:`使用 ${g} 建立 3 個分析資料集，查詢時間由 30 分鐘縮短至 5 分鐘`,st:""}));return out}
function applied(p){const L=(p.cvText||"").split("\n"),add=[];(p.sug||[]).forEach(s=>{if(s.st!=="ok")return;if(s.li<0||s.li>=L.length)add.push("・"+s.n);else{const pre=(L[s.li].match(/^[・•\-\s]+/)||[""])[0];L[s.li]=pre+s.n}});return L.concat(add).join("\n")}
function grade(q,a){a=(a||"").trim();const L=a.replace(/\s/g,"").length,sents=a.split(/[。！？!?；;\n，,]/).map(s=>s.trim()).filter(Boolean);
const nums=a.match(/\d+(\.\d+)?\s*(%|％|小時|分鐘|週|天|個|倍|萬|次|人|位|份|年|月)?/g)||[];
const conn=["首先","接著","然後","最後","結果","因此","所以","當時","我負責","我的做法","後來"].filter(w=>a.includes(w));
const kw=(q.k||[]).filter(Boolean),hit=kw.filter(w=>a.toLowerCase().includes(String(w).toLowerCase()));
const d={具體性:L?Math.min(25,Math.round(5+L/4)):0,量化數據:L?(nums.length?Math.min(25,14+nums.length*4):4):0,結構:L?Math.min(25,7+conn.length*6):0,切題:L?(kw.length?Math.min(25,10+hit.length*8):17):0},ev=[];
if(!L)ev.push("沒有作答");else{
ev.push(L<40?`回答約 ${L} 字，偏短，缺少情境與細節`:`回答約 ${L} 字，篇幅足夠 ✓`);
const nn=sents.find(s=>!/\d/.test(s)&&s.length>=6)||sents[0];
ev.push(nums.length?`「${cut(sents.find(s=>/\d/.test(s)))}」有具體數字 ✓`:`你說「${cut(nn)}」→ 沒有具體數字（規模、時間、百分比）`);
ev.push(conn.length?`使用了「${conn.slice(0,3).join("、")}」，結構清楚 ✓`:"沒有「當時、我的做法、結果」這類轉折，缺少「情境→行動→結果」的結構");
if(kw.length)ev.push(hit.length?`有回應題目重點：${hit.join("、")} ✓`:`沒有提到題目重點：${kw.slice(0,3).join("、")}`)}

function buildQs(p,n,prev){const g=(p.dx&&p.dx.gaps)||[];let q=[];

for(let n=1;n<=doc.numPages;n++){const tc=await(await doc.getPage(n)).getTextContent();let y=null,ln="";tc.items.forEach(it=>{const yy=Math.round(it.transform[5]);if(y!==null&&Math.abs(yy-y)>3){L.push(ln);ln=""}ln+=it.str;y=yy});L.push(ln)}
L=L.map(x=>x.trim()).filter(Boolean);if(L.join("").length<30){st.textContent="讀不到文字（可能是掃描圖片檔），請改貼文字。";return}

const p=P(V.id);p.secs={};Object.keys(S).forEach(k=>p.secs[k]=S[k].join("\n"));p.cvId=null;logEv("cv_parse",{pid:p.id});save();render()}catch(e){st.textContent="解析失敗："+(e&&e.message||e)+"。請改貼文字。"}}

let h=bar()+`<main><div class="grid"><div class="card" style="display:flex;gap:14px;align-items:center"><div class="av" style="width:56px;height:56px;font-size:22px">${esc(U.name[0])}</div><div><h3 style="margin:0">${esc(U.name)}</h3><span class="mut" style="font-size:13px">${esc(U.mail)}</span></div></div><div class="card"><h3>我的求職概況</h3>面試專案 <b>${D.proj.length}</b> 個｜模擬面試 <b>${sims.length}</b> 次｜平均分數 <b>${avg}</b></div></div>`;
if(D.sample)h+=`<div class="note${NC()}">目前包含範例資料（標示「範例」）。<a class="lnk" data-a="clrsample">清除範例資料</a> ${NB(8)}</div>`;
if(!D.proj.length)h+=`<div class="card${NC()}"><h2 style="margin-top:0">歡迎，${esc(U.name)}！三個步驟開始 ${NB(8)}</h2><div class="grid">${[["建立面試專案","輸入目標公司、職位與職缺說明"],["上傳履歷做 AI 診斷","套用改寫建議，產生這個職缺專用的履歷"],["開始語音模擬面試","拿到逐題評分、弱點分析與特訓建議"]].map((s,i)=>`<div class="stp"><span class="pn2">${i+1}</span><b>${s[0]}</b><br><small class="mut">${s[1]}</small></div>`).join("")}</div><div class="row"><button class="btn" data-a="new">建立第一個面試專案</button><button class="btn g" data-a="sample">載入範例資料（展示用）</button></div></div>${UI.form?newForm():""}`;
else h+=`<div class="row" style="justify-content:space-between"><h2 style="margin:6px 0">求職看板</h2><button class="btn" data-a="new">＋ 新增面試專案</button></div>${UI.form?newForm():""}<div class="kan">${ST.map((s,ci)=>`<div class="kcol"><h4>${s}</h4>${D.proj.filter(p=>p.st===ci).map(p=>`<div class="kc"><b>${esc(p.co)}</b>${p.sample?' <span class="tag w">範例</span>':""}<small>${esc(p.role)}｜面試日 ${esc(p.date||"未定")}</small><div class="row"><a data-a="open" data-i="${p.id}">開啟</a>${ci>0?`<a data-a="mv" data-i="${p.id}" data-d="-1">◀</a>`:""}${ci<3?`<a data-a="mv" data-i="${p.id}" data-d="1">▶</a>`:""}<a data-a="delp" data-i="${p.id}" style="color:var(--mut);font-weight:400">刪除</a></div></div>`).join("")}</div>`).join("")}</div>`;
if(sims.length)h+=`<div class="card" style="margin-top:14px"><h3>模擬面試紀錄</h3><p class="n2">每次完整模擬面試都會自動記錄。真實面試請到專案內的「面試復盤」。</p><div class="tbw"><table><tr><th>日期</th><th>專案</th><th>次數</th><th>分數</th><th>備註</th><th></th></tr>${[...sims].sort((a,b)=>b.date.localeCompare(a.date)).map(r=>{const pp=P(r.pid);return`<tr><td>${r.date}</td><td>${esc(pp?pp.co:"（已刪除）")}</td><td>${pp?"第 "+(simRecs(pp).indexOf(r)+1)+" 次":"-"}</td><td>${r.score==null?"-":r.score}</td><td>${esc(r.note)}</td><td>${r.res&&r.res.length&&pp?`<a class="lnk" style="margin:0" data-a="rep" data-i="${r.id}">查看報告</a> `:""}<a class="lnk mut" data-a="rdel" data-i="${r.id}">刪除</a></td></tr>`}).join("")}</table></div></div>`;
return h+vLibs()+vWeak()+`<div class="grid">${vResearch()}${vPrivacy()}</div></main>`}
function vLibs(){const used=new Set(D.proj.map(p=>p.cvId).filter(Boolean)),cov=COMP.filter(c=>D.st.some(s=>s.comp===c)),miss=COMP.filter(c=>!cov.includes(c));
const lst=(arr,k)=>arr.map(v=>`<div class="diff" style="display:flex;gap:8px;align-items:center"><span style="flex:1"><b>${esc(v.name)}</b> ${k==="cv"&&used.has(v.id)?'<span class="tag g">面試使用中</span>':""}${k==="st"&&v.comp?`<span class="tag">${esc(v.comp)}</span>`:""}${v.sample?'<span class="tag w">範例</span>':""}<br><small class="mut">${v.date}</small></span><a class="lnk" data-a="ov" data-k="${k}" data-i="${v.id}">檢視／編輯</a><a class="lnk mut" data-a="odel" data-k="${k}" data-i="${v.id}">刪除</a></div>`).join("")||'<small class="mut">尚無資料</small>';
return`<div class="grid"><div class="card"><h3>履歷版本庫</h3><p class="n2">針對不同職缺保存的履歷版本。在履歷診斷套用建議後，會自動產生新版本。</p>${lst(D.cv,"cv")}</div><div class="card"><div class="row" style="justify-content:space-between;margin:0"><h3 style="margin:0">故事庫</h3><button class="btn g s" data-a="ov" data-k="st" data-i="new">＋ 新增故事</button></div><p class="n2">把經歷整理成 STAR 故事，面試時重複使用。</p><div class="${NC()}" style="padding:6px;margin-bottom:6px"><b style="font-size:13px">能力涵蓋 ${NB(7)}</b><br>${cov.map(c=>`<span class="tag g">✓ ${c}</span>`).join("")}${miss.map(c=>`<span class="tag" style="cursor:pointer" data-a="ov" data-k="st" data-i="new" data-c="${c}">＋ 缺 ${c}</span>`).join("")}</div>${lst(D.st,"st")}</div></div>`}
function vWeak(){const rows=D.proj.map(p=>{const e=Object.entries(tagStat(p));return e.length?`<div style="margin:6px 0"><b>${esc(p.co)}</b>：${e.map(([t,v])=>chip(t,v.st)).join("")}</div>`:""}).join("");
return`<div class="card${NC()}"><h3>弱點標籤 ${NB(4)}</h3><p class="n2">待改善 → 特訓中・待驗證 → 再做一次完整面試達 70 分 → 已改善</p>${rows||'<small class="mut">完成模擬面試後會出現</small>'}</div>`}
function vResearch(){if(!D.research)return`<div class="card${NC()}"><h3>研究資料 ${NB(9)}</h3><p style="margin:0;font-size:14px">你未同意提供研究資料，系統不會記錄操作。可在「隱私與資料」改為同意。</p></div>`;const dt=firstFlow();
return`<div class="card${NC()}"><h3>研究資料 ${NB(9)}</h3><div>${ms().map(x=>`<span class="tag ${x.done?"g":""}">${x.done?"✓":"○"} ${x.l}</span>`).join("")}</div><p style="margin:8px 0 0;font-size:14px">已記錄操作 ${D.ev.length} 筆${dt!=null?`｜從開始使用到完成第一場面試：${dt} 分鐘`:""}<br>易用性問卷（SUS）：${D.sus?`<b>${D.sus.score}</b> 分（68 分為一般平均）`:'未填寫 <a class="lnk" data-a="susopen">填寫</a>'}</p><div class="row"><button class="btn g s" data-a="exp">匯出匿名研究資料（JSON）</button></div><p class="n2" style="margin-top:6px">匯出檔不含姓名、Email、公司名稱與履歷內容。正式版會在受試者同意後自動上傳後端，由研究人員統一匯出。</p></div>`}
function vPrivacy(){return`<div class="card${NC()}"><h3>隱私與資料 ${NB(6)}</h3><div style="font-size:14px">服務資料使用：已同意（${esc(D.consent)}）<br>研究資料提供：${D.research?"已同意":"未同意"}<br>資料位置：本 demo 只存在這個瀏覽器</div><div class="row"><button class="btn g s" data-a="research">${D.research?"撤回研究同意":"同意提供研究資料"}</button><button class="btn g s" data-a="wipe">刪除我的所有資料</button></div></div>`}

function vProj(){const p=P(V.id);if(!p){V={v:"home"};return vHome()}
if(V.step===2&&sessions(p).length&&!p.viewed){p.viewed=true;logEv("view_report",{pid:p.id});save()}
const ss=sessions(p),dn=[!!p.dx,ss.length>0,!!p.viewed,Object.keys(p.drill||{}).length>0,ss.length>=2,D.rec.some(r=>r.pid===p.id&&r.type==="真實")],nx=dn.indexOf(false),live=I&&I.pid===p.id;
const b=[vCv,vIv,vRep,vDrill,vTrend,vRv][V.step](p);
const hint=V.step===0&&!p.dx?"還沒完成 AI 診斷：模擬面試會改用通用題目":V.step===1&&!ss.length?"完成一場面試後才會產生報告":V.step===3&&dn[3]?"特訓後建議回到「模擬面試」再做一次完整面試，驗證是否進步":"";
const nav=`<div class="row${NC()}" style="justify-content:space-between;margin-top:18px;padding:6px">${V.step>0?`<button class="btn g" data-a="step" data-i="${V.step-1}">← ${STEPS[V.step-1]}</button>`:"<span></span>"}<span>${NB(1)}</span>${V.step<5?`<button class="btn" data-a="step" data-i="${V.step+1}">下一步：${STEPS[V.step+1]} →</button>`:"<span></span>"}</div>${hint?`<p class="n2" style="text-align:right;margin-top:6px">${hint}</p>`:""}`;
return bar()+`<main><a class="lnk" style="margin:0" data-a="home">← 返回看板</a><h2 style="margin:6px 0 0">${esc(p.co)}｜${esc(p.role)} <span class="tag">${ST[p.st]}</span>${p.sample?'<span class="tag w">範例</span>':""}</h2>
<div class="prog${NC()}">${STEPS.map((s,i)=>`<button class="ps${V.step===i?" on":""}${dn[i]?" done":""}" data-a="step" data-i="${i}"><span class="pn">${dn[i]?"✓":i+1}</span>${s}</button>`).join("")}${NB(1)}</div>
${nx>=0&&nx!==V.step&&!live?`<div class="note">建議下一步：<a class="lnk" style="margin:0" data-a="step" data-i="${nx}">${STEPS[nx]}</a>（已完成 ${dn.filter(Boolean).length} / 6 步）</div>`:""}${b}${live?"":nav}</main>`}

function vCv(p){const s=p.secs;let h=`<div class="card"><h3>上傳 104 履歷 PDF</h3><p class="n2">在瀏覽器內解析，檔案不會上傳到伺服器。解析後請先確認內容，再進行 AI 診斷。</p><input type="file" id="pdf" accept="application/pdf"><div class="row"><button class="btn" data-a="parse">解析 PDF</button><span id="pst" class="mut" style="font-size:13px"></span></div>${D.cv.length?`<label>或從履歷版本庫載入</label><div class="row" style="margin:0"><select id="cvsel" style="flex:1;width:auto"><option value="">選擇履歷版本⋯⋯</option>${D.cv.map(v=>`<option value="${v.id}" ${v.id===p.cvId?"selected":""}>${esc(v.name)}</option>`).join("")}</select><button class="btn g s" data-a="loadcv">載入</button></div>`:""}</div>
<div class="card"><h3>確認履歷內容</h3>${s?`<p class="n2">以下是從 PDF 擷取的欄位，若有誤請直接修改。</p>`+Object.keys(s).map(k=>`<label>${esc(k)}</label><textarea class="sec" data-k="${esc(k)}">${esc(s[k])}</textarea>`).join(""):`<p class="n2">尚未解析 PDF，也可以直接貼上履歷文字。${p.cvText?"":'<a class="lnk" data-a="fillcv">填入範例履歷</a>'}</p><textarea id="cv" placeholder="貼上履歷內容">${esc(p.cvText||"")}</textarea>`}<div class="row"><button class="btn" data-a="dx">確認無誤，開始 AI 診斷</button>${s?`<button class="btn g" data-a="resec">改回貼上文字</button>`:""}</div></div>`;
return p.dx?h+vDx(p):h}
function vDx(p){const d=p.dx,sg=p.sug||[],ok=sg.filter(s=>s.st==="ok").length,nt=applied(p),nm=matchOf(p.jd,nt).match;
return`<div class="grid"><div class="card" style="display:flex;gap:14px;align-items:center"><div class="ring" style="--p:${d.match}"><span>${d.match}%</span></div><div><h3>職缺匹配度</h3>${d.gaps.length?d.gaps.map(g=>`<span class="tag">缺漏：${esc(g)}</span>`).join(""):'<span class="tag g">關鍵能力皆已涵蓋</span>'}</div></div><div class="card"><h3>預測可能被問的考題</h3><ul style="margin:0;padding-left:18px">${d.pq.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div></div>
<div class="card${NC()}"><h3>逐條改寫建議 ${NB(2)}</h3><p class="n2">每條可以套用、略過，或先修改文字再套用。建議中的數字只是範例，請改成你的真實數據。</p>
${sg.length?sg.map((s,i)=>`<div class="sug"><div class="diff o">原文：${esc(s.o)}</div><input id="sg${i}" value="${esc(s.n)}" ${s.st?"disabled":""}><div class="row" style="margin-top:6px">${s.st==="ok"?`<span class="tag g">✓ 已套用</span><a class="lnk" data-a="sgundo" data-i="${i}">復原</a>`:s.st==="skip"?`<span class="tag">已略過</span><a class="lnk" data-a="sgundo" data-i="${i}">復原</a>`:`<button class="btn s" data-a="sgok" data-i="${i}">套用</button><button class="btn g s" data-a="sgskip" data-i="${i}">略過</button>`}</div></div>`).join("")
+`<label>新版履歷預覽（已套用 ${ok} 條）</label><textarea readonly style="min-height:120px">${esc(nt)}</textarea><p style="margin:6px 0;font-size:14px">預估匹配度：${d.match}% → <b>${nm}%</b></p><div class="row"><button class="btn" data-a="mkcv" ${ok?"":"disabled"}>產生新版履歷，並設為這個職缺的面試版本</button></div>`:"<p style=\"font-size:14px\">每一條都已經有具體數字，沒有需要改寫的地方。</p>"}
<p class="n2" style="margin-top:10px">目前面試使用：<span class="tag g">${esc(cvName(p))}</span></p></div>`}

function vIv(p){if(I&&I.pid===p.id)return vRoom(p);const all=simRecs(p),n=all.length+1,ss=sessions(p);let h="";
if(D.live&&D.live.pid===p.id)h+=`<div class="card${NC()}"><h3>有一場未完成的面試 ${NB(11)}</h3><span style="font-size:14px">第 ${D.live.n} 次面試，已回答 ${D.live.i} / ${D.live.q.length} 題（可能因為重新整理、斷線或關閉頁面而中斷）。</span><div class="row"><button class="btn" data-a="resume">從中斷處繼續</button><button class="btn g" data-a="abandon">放棄這場</button></div></div>`;
if(all.length)h+=`<div class="card"><h3>這個職缺的練習紀錄</h3>${all.map((r,i)=>{const d=i>0&&r.score!=null&&all[i-1].score!=null?r.score-all[i-1].score:null;return`<div class="diff" style="display:flex;gap:8px;align-items:center"><span style="flex:1">第 ${i+1} 次｜${r.date}｜${r.score==null?"-":r.score+" 分"}${d==null?"":`（${d>=0?"+":""}${d}）`}</span>${r.res&&r.res.length?`<a class="lnk" data-a="rep" data-i="${r.id}">查看報告</a>`:""}</div>`}).join("")}</div>`;
const prev=UI.carry&&ss.length?ss[0]:null,qs=buildQs(p,n,prev),c=f=>qs.filter(f).length,cg=c(x=>x.t==="專業能力"),cw=c(x=>x.src==="上次弱點"),cr=c(x=>x.src==="真實面試");
h+=`<div class="card${NC()}"><h3>第 ${n} 次完整面試・面試前準備 ${NB(5)}</h3>
<div class="${NC()}" style="padding:6px;margin-bottom:10px"><b style="font-size:13px">環境檢查 ${NB(11)}</b><br><span style="font-size:14px">語音辨識：${SR?"✓ 支援":"✗ 不支援，將改用文字輸入"}｜語音播報：${HAS_TTS?"✓ 支援":"✗ 不支援"}｜網路：${navigator.onLine?"✓ 連線中":"✗ 離線"}</span></div>
<b style="font-size:14px">① 麥克風測試</b><div class="row" style="margin-top:4px"><button class="mic" id="mtb" data-a="mictest" ${SR?"":"disabled"}>🎙</button><span id="mt" style="font-size:14px">${SR?"按下後說一句話，確認可以辨識":"此瀏覽器不支援語音辨識，面試將使用文字輸入"}</span></div>
<b style="font-size:14px;display:block;margin-top:12px">② 面試規則</b><div style="font-size:14px">共 ${qs.length} 題，每題可能追問一次，約 ${qs.length*2} 分鐘。過程中可以隨時暫停，或提前結束並產生報告。</div>
<div style="margin-top:6px">使用履歷：<span class="tag g">${esc(cvName(p))}</span>${cg?`<span class="tag">履歷缺口 ${cg} 題</span>`:""}${cw?`<span class="tag w">上次弱點 ${cw} 題</span>`:""}${cr?`<span class="tag w">真實面試題 ${cr} 題</span>${NB(10)}`:""}</div>
<b style="font-size:14px;display:block;margin-top:12px">③ 面試設定</b><label>面試官風格</label><select onchange="UI.sty=this.value" style="max-width:280px"><option value="親切" ${UI.sty==="親切"?"selected":""}>親切（鼓勵型）</option><option value="嚴格" ${UI.sty==="嚴格"?"selected":""}>嚴格（壓力型）</option></select>
<label class="ck" style="margin-top:8px"><input type="checkbox" ${UI.tts?"checked":""} onchange="UI.tts=this.checked">AI 語音播報題目</label>${ss.length?`<label class="ck"><input type="checkbox" data-a="carry" ${UI.carry?"checked":""}>帶入上次分數最低的 2 題</label>`:""}
<p class="n2" style="margin-top:6px">不當提問：${p.bad?"開":"關"}｜薪資談判：${p.sal?"開":"關"}${p.dx?"":"｜尚未完成履歷診斷，將使用通用題目"}</p>
<div class="note">示範以瀏覽器語音（朗讀＋語音辨識）模擬即時對談；正式版由瀏覽器以 WebRTC 直連 OpenAI Realtime，語音即時雙向。</div>
<div class="row"><button class="btn" data-a="start">開始第 ${n} 次完整面試</button></div></div>`;return h}
function vRoom(){const q=I.q;return`<div class="card"><div class="row" style="justify-content:space-between;margin:0"><h3 style="margin:0">面試中｜${esc(I.sty)}面試官</h3><span id="pg" class="mut" style="font-size:13px">第 ${Math.min(I.i+1,q.length)} / ${q.length} 題</span></div>
${!SR?`<div class="note${NC()}" style="margin-top:8px">此瀏覽器不支援語音辨識，已改用文字輸入（建議使用電腦版 Chrome）${NB(11)}</div>`:""}
<div class="chat" id="chat">${I.log.map(l=>`<div class="msg ${l.r}">${esc(l.t)}</div>`).join("")}${I.paused?'<div class="msg ai">⏸ 面試已暫停，準備好後按「繼續」。</div>':""}</div>
<div class="row"><button class="mic" id="mic" data-a="mic" ${!SR||I.paused?"disabled":""}>🎙</button><input id="ans" placeholder="${SR?"按麥克風說話，或在此輸入回答":"請在此輸入回答"}" style="flex:1;width:auto" ${I.paused?"disabled":""}><button class="btn" data-a="send" ${I.paused?"disabled":""}>送出</button></div>
<div class="row${NC()}" style="padding:4px"><button class="btn g s" data-a="pause">${I.paused?"▶ 繼續":"⏸ 暫停"}</button><button class="btn g s" data-a="endearly">提前結束並產生報告</button>${NB(5)}</div></div>`}

function vRep(p){const ss=sessions(p);if(!ss.length)return`<div class="card">尚無報告，請先完成一場模擬面試。</div>`;

rv(){const p=P(V.id),qs=$("#rv").value.split("\n").map(s=>s.trim()).filter(Boolean),res=$("#rres").value,stage=$("#rst").value,nt=$("#rvn").value;
if(!qs.length&&!nt){toast("請至少輸入被問到的題目或心得");return 1}p.bank=p.bank||[];qs.forEach(q=>{if(!p.bank.some(b=>b.q===q))p.bank.push({q,date:today(),stage})});
D.rec.push({id:uid(),pid:p.id,date:$("#rdate").value||today(),type:"真實",score:null,stage,result:res,qs,note:nt,res:[]});
p.st=res==="錄取"||res==="未錄取"?3:res==="進入下一關"?1:2;logEv("review",{pid:p.id,result:res,q:qs.length});toast(`已儲存，${qs.length} 題加入題庫，看板狀態更新為「${ST[p.st]}」`)},
delbank(i){P(V.id).bank.splice(+i,1)},
ov(i,b){UI.ov={k:b.dataset.k,id:i,c:b.dataset.c}},oclose(){UI.ov=null},
osave(){const o=UI.ov,arr=o.k==="cv"?D.cv:D.st,n=$("#o_n").value.trim()||"未命名",t=$("#o_t").value,c=$("#o_c")?$("#o_c").value:undefined;
if(o.id==="new")arr.push({id:uid(),name:n,text:t,comp:c,date:today()});else{const x=arr.find(z=>z.id===o.id);x.name=n;x.text=t;if(c)x.comp=c}UI.ov=null},
odel(i,b){if(confirm("確定刪除？"))D[b.dataset.k]=D[b.dataset.k].filter(v=>v.id!==i)},
susopen(){UI.sus=true},susx(){UI.sus=false},
susok(){const ans=SUS.map((_,i)=>{const e=document.querySelector(`input[name=s${i}]:checked`);return e?+e.value:0});const miss=ans.filter(v=>!v).length;if(miss){toast(`還有 ${miss} 題未作答`);return 1}
const score=Math.round(ans.reduce((a,v,i)=>a+(i%2===0?v-1:5-v),0)*2.5*10)/10;D.sus={score,ans,cm:$("#scm").value,date:today()};UI.sus=false;logEv("survey",{score});toast(`感謝填寫！SUS 分數 ${score}`)},
exp(){const px={};D.proj.forEach((p,i)=>px[p.id]="專案"+(i+1));
const data={participant:hsh(U.mail),exportedAt:new Date().toISOString(),version:"v3",milestones:ms(),minutesToFirstInterview:firstFlow(),sus:D.sus?{score:D.sus.score,answers:D.sus.ans}:null,
events:D.ev.map(e=>{const o=Object.assign({},e);if(o.pid)o.pid=px[o.pid]||"已刪除專案";return o}),
interviews:D.rec.filter(r=>r.type==="模擬").map(r=>({project:px[r.pid]||"已刪除專案",date:r.date,score:r.score,durationSec:r.dur||null,questions:(r.res||[]).map(x=>({type:x.t,score:x.s,dims:x.d}))}))};
try{const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=data.participant+"_research.json";document.body.append(a);a.click();a.remove();logEv("export");save()}catch(e){toast("匯出失敗，請改用電腦瀏覽器")}return 1},
research(){if(D.research){if(!confirm("撤回研究同意？已記錄的操作紀錄與問卷會一併刪除。"))return 1;D.research=false;D.ev=[];D.sus=null;toast("已撤回研究同意")}else{D.research=true;logEv("consent_research");toast("已同意提供研究資料")}},
wipe(){if(!confirm("刪除這個帳號在本裝置的所有資料？此動作無法復原。"))return 1;try{localStorage.removeItem(KV+"u_"+U.mail);localStorage.removeItem(KV+"session")}catch(e){}U=null;D=null;I=null;V={v:"home"};render();toast("已刪除所有資料");return 1},
cl(i){UI.cl=+i},clx(){UI.cl=null},
togglenew(){UI.showNew=!UI.showNew;try{localStorage.setItem(KV+"shownew",UI.showNew?"1":"0")}catch(e){}}};

document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||!A[b.dataset.a])return;const keep=A[b.dataset.a](b.dataset.i,b);save();if(keep!==1)render()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&e.target.id==="ans")sendAns()});
window.addEventListener("offline",netBan);window.addEventListener("online",()=>{netBan();toast("網路已恢復，可以繼續作答")});
boot();render();
</script>
</body>
</html>
