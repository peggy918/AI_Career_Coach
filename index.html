const BE=[
mk("BE-OP-01",1,"a","請用 2 分鐘介紹你自己，特別是跟後端開發有關的經驗。",["你提到的專案，你負責的是哪一塊？"],[["技術棧","Python","Go","Java","Node","FastAPI","Django","Spring","MySQL","PostgreSQL","Redis","API"],["代表專案","專案","系統","服務","平台"],["想做的方向","希望","想要","方向","目標","接下來"]],[["念履歷式流水帳","然後我又","之後我又"]],[D_COM,D_MOT],"我有 2 年後端經驗，主力是 Python 與 FastAPI。代表專案是電商訂單 API，我負責把查詢從 800ms 降到 200ms。接下來想深化高流量服務的效能與穩定性，這也是我應徵這個職缺的原因。",{must:1,comp:"成就經驗"}),
mk("BE-OP-02",1,"a","為什麼想應徵{co}的這個職缺？你怎麼理解我們的產品？",["你覺得我們的產品在後端上最大的挑戰是什麼？"],[["提到公司或產品","{co}","產品","客戶"],["連結自己的能力","我的經驗","我擅長","我做過","我負責","和我"]],[["只談名氣或福利","有名","福利","大公司"]],[D_MOT,D_COM],"我看到{co}的產品要處理大量即時資料，這和我做過的效能調校經驗相關；我想在更大的流量規模下累積系統設計經驗。",{must:1,comp:"職涯動機"}),
mk("BE-OP-03",1,"a","你為什麼選擇後端，而不是前端或其他方向？",["未來 3 年你希望在後端深化哪個領域？"],[["具體興趣點","資料","效能","架構","穩定"],["學習軌跡","學","專案","開始"]],[],[D_MOT,D_COM],"我喜歡解決資料與效能問題，從大學專題寫 API 開始，到工作上調校慢查詢；未來 3 年想深化分散式系統與可觀測性。",{comp:"職涯動機"}),
mk("BE-TB-01",2,"j","從瀏覽器輸入網址到看到頁面，中間發生了什麼？",["HTTPS 比 HTTP 多了哪些步驟？"],[["DNS 查詢","DNS"],["TCP 連線","TCP","握手"],["TLS 加密","TLS","SSL","HTTPS","憑證"],["伺服器處理與回應","伺服器","回應","渲染"]],[],[D_ACC,D_DEP],"先經 DNS 查到 IP，建立 TCP 連線，HTTPS 再做 TLS 握手；接著送出 HTTP 請求，伺服器處理後回傳回應，瀏覽器再解析與渲染頁面。"),
mk("BE-TB-02",2,"a","GET、POST、PUT、PATCH 差在哪？什麼是冪等？",["401 和 403 差在哪？502 和 503 呢？","服務間呼叫失敗重試時，冪等為什麼重要？"],[["說明冪等","冪等","同樣的結果","結果相同","結果都一樣","idempotent"],["PUT 與 PATCH 差異","整筆","部分","局部","取代"],["舉實際 API","例如","像是","比如"]],[["把 POST 當萬用方法","都用 POST","全部用 POST"],["狀態碼全回 200","都回 200","全部回 200"]],[D_ACC,D_DEP],"GET 讀取、POST 新增、PUT 整筆取代、PATCH 部分更新。冪等是同一請求送多次結果相同，例如 PUT 更新地址送兩次結果一樣，但 POST 建立訂單送兩次會多一筆，所以重試時要帶冪等鍵。"),

mk("BE-DB-01",3,"a","關聯式資料庫和 NoSQL 各適合什麼場景？",["你的專案為什麼選這個資料庫？"],[["資料關係","關聯","關係","join"],["一致性需求","一致性","交易","ACID"],["擴展方式","擴展","水平","schema","彈性"]],[["老師教的／大家都用","老師教","大家都用"]],[D_ACC,D_DEP,D_EXP],"關係明確、需要交易一致性的訂單與會員用關聯式；格式常變動或要水平擴展的事件、日誌用 NoSQL。我的專案選 MySQL，因為訂單需要交易。"),

mk("BE-DB-04",3,"m","索引為什麼能加速查詢？哪些欄位適合建索引？",["複合索引的欄位順序有差嗎？為什麼建了索引卻沒用到？"],[["B-tree 結構","B-tree","B+","樹"],["最左前綴","最左","前綴"],["寫入成本","寫入","成本","空間"]],[["每個欄位都建索引","每個欄位都建","全部都建索引"]],[D_ACC,D_DEP],"索引多用 B+ tree，讓查詢不必掃全表；適合常用於 WHERE、JOIN 且區分度高的欄位。複合索引要符合最左前綴，對欄位做函式運算會用不到索引；索引也會增加寫入成本。"),

:mk("GAP-"+t,5,"a",`職缺需要「${t}」，請舉一個你的實際經驗並說明成果。`,["這個成果你是怎麼衡量的？"],[["具體實例","當時","有一次","專案"],["量化成果","%","小時","倍"]],[],[D_EXP,D_COM],`當時我負責（專案），我的做法是運用 ${t}，結果（請補上數字）。`,{src:"技能落差",pri:1,gapt:t})}
function compose(p,n,prev,len){const kind=kindOf(p),lvl=lvlOf(p),plan=planOf(kind,len,lvl),total=Object.values(plan).reduce((a,b)=>a+b,0),cap=Math.floor(total/3);
const bank=kind==="be"?BE:GEN,okLv=q=>q.lv==="a"||q.lv===(lvl==="jr"?"j":"m");
const gaps=kind==="be"?techGaps(p):((p.dx&&p.dx.gaps)||[]);
let cus=gaps.slice(0,kind==="be"?1:2).map(g=>gapQ(g,kind));
bank.filter(q=>q.jd&&okLv(q)&&q.jd.some(k=>has(p.jd,k))).forEach(q=>cus.push(Object.assign({},q,{src:"客製"})));
cus.sort((a,b)=>(a.pri||5)-(b.pri||5));
let out=[],cc=0;const musts={},room={},picked={};
Object.keys(plan).map(Number).forEach(st=>{musts[st]=bank.filter(q=>q.st===st&&q.must&&okLv(q)).slice(0,plan[st]);room[st]=st===7?0:plan[st]-musts[st].length;picked[st]=[]});
cus.forEach(q=>{if(cc<cap&&room[q.st]>0&&!musts[q.st].some(m=>m.id===q.id)&&!Object.values(picked).some(a=>a.some(x=>x.id===q.id))){picked[q.st].push(q);room[q.st]--;cc++}});
Object.keys(plan).map(Number).sort((a,b)=>a-b).forEach(st=>{const k=plan[st];
if(st===7){out.push(Object.assign({},RV,{src:"通用"}));return}
const sel=musts[st].map(q=>Object.assign({},q,{src:"通用"})),cSel=picked[st];
let pool=bank.filter(q=>q.st===st&&!q.must&&(!q.jd||q.gen)&&okLv(q)&&!cSel.some(c=>c.id===q.id));
if(kind==="be"&&st===4&&!cSel.some(c=>c.sd))pool=[sdQ(lvl,n),...pool];

for(let j=0;j<pool.length&&gSel.length<slots;j++)gSel.push(Object.assign({},pool[(off+j)%pool.length],{src:"通用"}));

(p.bank||[]).slice(-2).forEach(b=>{if(out.some(o=>o.q===b.q))return;swap(mk("RQ-"+hsh(b.q),0,"a",b.q,["可以舉一個具體的例子嗎？"],[["具體實例","當時","有一次","之前"],["說明結果","結果","最後","%"]],[],[D_EXP,D_COM],"建議用「情境→任務→行動→結果」回答，並補上具體數字。",{src:"真實面試"}),[6,5])});

if(p.bad)out.splice(before7(),0,mk("X-BAD",6,"a","（不當提問）你有打算結婚或生小孩嗎？",[],[["回到工作表現","工作","專注","表現","目標"],["態度得體","理解","了解"]],[],[D_COM],"我理解您想了解我的穩定度。我的規劃是專注在這個職位的表現，也很樂意聊聊我的工作目標。",{src:"不當提問"}));

/* ===== 追問規則與評分 ===== */
function gsHit(q,a){return(q.gs||[]).filter(g=>g.slice(1).some(k=>inc(a,k)))}

if(q.st===6&&!/當時|那時|之前|有一次|曾經|上次|最近/.test(t)&&!q._ex){q._ex=1;return{t:"可以舉一個你實際遇到的例子嗎？",why:"行為題回答成假設情境 → 要求實際經驗"}}
if(/我們/.test(t)&&!/我負責|我寫|我設計|我做|我的|我主導/.test(t)&&!q._we){q._we=1;return{t:"這部分你個人負責的是什麼？",why:"用「我們」描述 → 確認個人貢獻"}}
if(L<25&&!q._ex){q._ex=1;return{t:"可以舉一個你實際遇到的例子嗎？",why:"回答太籠統 → 要求實例"}}
const f=(q.f||[])[stdUsed];if(f){const strong=(q.gs||[]).length&&gsHit(q,t).length>=Math.ceil(q.gs.length/2)&&!rfHit(q,t).length&&L>=40;return{t:(sty==="嚴格"?"":"了解。")+f,why:strong?"回答完整 → 加壓一層，測試上限":"使用這題的標準追問",std:1}}
return null}
function grade(q,a,meta){a=(a||"").trim();meta=meta||{};const L=a.replace(/\s/g,"").length,sents=a.split(/[。！？!?；;\n，,]/).map(s=>s.trim()).filter(Boolean),dims=q.dims&&q.dims.length?q.dims:[D_EXP,D_COM];

if(!L){dims.forEach(k=>d[k]=1);return{s:20,d,ev:["沒有作答"]}}
if(q.st===7){const none=/^(沒有|沒問題|沒有問題)/.test(a),badF=/休假|加班|請假|薪水/.test(sents[0]||""),good=gsHit(q,a);const v=none?1:badF?2:good.length>=2?5:good.length?4:3;
dims.forEach(k=>d[k]=v);ev.push(none?"⚠ 回答「沒有問題」，錯過展現興趣的機會":badF?`⚠ 第一個問題就問休假或加班（你問「${cut(sents[0],30)}」）`:good.length?`✓ 問到${good.map(g=>g[0]).join("、")}`:"問題偏一般，可以問技術棧、開發流程或新人前三個月的任務");return{s:Math.round(v/5*100),d,ev}}
const gs=q.gs||[],hit=gsHit(q,a),miss=gs.filter(g=>!hit.includes(g)),rf=rfHit(q,a),ratio=gs.length?hit.length/gs.length:(L>60?.6:.3),nums=(a.match(/\d+(\.\d+)?/g)||[]).length;
const cnt=ws=>ws.filter(w=>a.includes(w)).length,why=cnt(["因為","所以","取捨","比較","缺點","代價","相較","優點","適合","但"]),steps=cnt(["首先","接著","然後","最後","第一","第二","先","再"]);
const me=/我負責|我寫|我設計|我做|我的做法|我先|我會|我主導/.test(a),story=/當時|有一次|之前|那時|最近/.test(a),onlyWe=/我們/.test(a)&&!me,sdMiss=q.sd&&gs[0]&&!hit.includes(gs[0]);

function armSil(){if(!LIVE||!I)return;clearTimeout(silT);const i=I.i,l=I.layer;silT=setTimeout(()=>{if(I&&!I.paused&&!rc&&I.i===i&&I.layer===l&&!(($("#ans")||{}).value)&&!(I.nud||{})[i+"_"+l]){I.nud=I.nud||{};I.nud[i+"_"+l]=1;say("可以邊想邊說，不用一次想到完整答案。","ai","停頓超過 20 秒 → 提醒可以邊想邊說")}},20000)}

const g=$("#pg");if(g)g.textContent=`第 ${I.i+1} / ${I.q.length} 題`;say(q.q,"ai");armSil()}
function startIv(){const p=P(V.id),n=simRecs(p).length+1,ss=sessions(p),prev=UI.carry&&ss.length?ss[0]:null,C=compose(p,n,prev,UI.len);

function loadPdf(){return new Promise((ok,no)=>{if(window.pdfjsLib)return ok(window.pdfjsLib);const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob(['importScripts("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")'],{type:"text/javascript"}))}catch(e){}ok(window.pdfjsLib)};
s.onerror=()=>no(new Error("無法載入 PDF 解析元件，請確認網路"));document.head.append(s)})}
async function doParse(){const f=$("#pdf").files[0],st=$("#pst");if(!f){st.textContent="請先選擇 PDF 檔";return}st.textContent="解析中⋯⋯";
try{const lib=await loadPdf(),doc=await lib.getDocument({data:await f.arrayBuffer()}).promise;let L=[];
for(let n=1;n<=doc.numPages;n++){const tc=await(await doc.getPage(n)).getTextContent();let y=null,ln="";tc.items.forEach(it=>{const yy=Math.round(it.transform[5]);if(y!==null&&Math.abs(yy-y)>3){L.push(ln);ln=""}ln+=it.str;y=yy});L.push(ln)}
L=L.map(x=>x.trim()).filter(Boolean);if(L.join("").length<30){st.textContent="讀不到文字（可能是掃描圖片檔），請改貼文字。";return}
const H=["基本資料","求職條件","工作經歷","工作經驗","學歷","教育程度","語文能力","專長","技能","證照","自傳","作品","其他"],S={};let cur="基本資料";
L.forEach(l=>{const h=H.find(x=>l.replace(/\s/g,"")===x);if(h){cur=h;return}(S[cur]=S[cur]||[]).push(l)});
const p=P(V.id);p.secs={};Object.keys(S).forEach(k=>p.secs[k]=S[k].join("\n"));p.cvId=null;logEv("cv_parse",{pid:p.id});save();render()}catch(e){st.textContent="解析失敗："+(e&&e.message||e)+"。請改貼文字。"}}
function collectSecs(p){const t=[...document.querySelectorAll(".sec")];t.forEach(x=>{p.secs[x.dataset.k]=x.value});return Object.keys(p.secs).map(k=>k+"\n"+p.secs[k]).join("\n")}

log.push({r:"ai",t:q.q,s:t,qi:i});t+=8;const sc=script[q.id]||["（這題沒有回答）"];let layer=0,std=0,k=0;ans[i]=[];fus[i]=[];
const answer=x=>{ans[i].push(x);t+=12+Math.round(x.length*0.5);log.push({r:"me",t:x,s:t,qi:i});t+=5};answer(sc[k++]);

const res=buildRes(qs,ans,fus,p.co);return{id:uid(),sample:true,pid:p.id,date,type:"模擬",score:Math.round(res.reduce((a,b)=>a+b.s,0)/res.length),note:`第 ${n} 次完整面試｜${res.length} 題｜標準 30 分鐘`,res,log,dur:t,tags:["親切面試官",KIND.be,LVL.mid],cv:"後端通用版 v1",len:"std",kind:"be",lvl:"mid",gaps:C.gaps,cap:C.cap,cc:C.cc}}

function vRoom(){const q=I.q,cur=q[Math.min(I.i,q.length-1)].st,sts=[...new Set(q.map(x=>x.st))];

<div class="stg${NC()}">${sts.map(s=>`<span class="sc${s===cur?" on":s<cur?" done":""}">${s<cur?"✓ ":""}${STG[s]}</span>`).join("")}${NB(12)}</div>
${!SR?`<div class="note${NC()}" style="margin-top:8px">此瀏覽器不支援語音辨識，已改用文字輸入（建議使用電腦版 Chrome）${NB(11)}</div>`:""}
<div class="chat" id="chat" style="max-height:380px">${I.log.map(l=>`<div class="msg ${l.r}">${esc(l.t)}${l.why&&UI.why?`<div class="why">↳ AI 判斷：${esc(l.why)}</div>`:""}</div>`).join("")}${I.paused?'<div class="msg ai">⏸ 面試已暫停，準備好後按「繼續」。</div>':""}</div>
<div class="row"><button class="mic" id="mic" data-a="mic" ${!SR||I.paused?"disabled":""}>🎙</button><input id="ans" placeholder="${SR?"按麥克風說話，或在此輸入回答":"請在此輸入回答"}" style="flex:1;width:auto" ${I.paused?"disabled":""}><button class="btn" data-a="send" ${I.paused?"disabled":""}>送出</button></div>
<div class="row${NC()}" style="padding:4px"><button class="btn g s" data-a="pause">${I.paused?"▶ 繼續":"⏸ 暫停"}</button><button class="btn g s" data-a="endearly">提前結束並產生報告</button>${NB(5)}<label class="ck" style="margin:0 0 0 auto"><input type="checkbox" data-a="why" ${UI.why?"checked":""}>顯示 AI 追問判斷（展示用）${NB(15)}</label></div></div>`}

function vRep(p){const ss=sessions(p);if(!ss.length)return`<div class="card">尚無報告，請先完成一場模擬面試。</div>`;
const r=ss.find(x=>x.id===V.rs)||ss[0],all=simRecs(p),idx=all.indexOf(r),prev=all.slice(0,idx).reverse().find(z=>z.score!=null),d=prev?r.score-prev.score:null;
return`<div class="steps">${ss.slice().reverse().map(x=>`<button class="${x.id===r.id?"on":""}" data-a="rs" data-i="${x.id}">第 ${all.indexOf(x)+1} 次｜${x.score} 分</button>`).join("")}</div>
<div class="card"><h3>第 ${idx+1} 次完整面試｜${r.date}</h3><div class="row" style="margin:0"><div class="ring" style="--p:${r.score}"><span>${r.score}</span></div><div style="font-size:14px">用時 ${mmss(r.dur||0)}｜${r.res.length} 題｜追問 ${r.res.reduce((a,x)=>a+Math.max(0,(x.turns||[]).length-1),0)} 次${d==null?"":`｜較上次 <b style="color:${d>=0?"var(--ok)":"var(--ac2)"}">${d>=0?"+":""}${d}</b>`}<br><span class="mut">使用履歷：${esc(r.cv||"-")}</span><br>${(r.tags||[]).map(t=>`<span class="tag g">${esc(t)}</span>`).join("")}</div></div></div>
${D.research&&!D.sus?`<div class="card${NC()}"><h3>幫我們填一份 1 分鐘問卷 ${NB(9)}</h3><p style="margin:0;font-size:14px">你的回饋會以匿名方式用於專題的易用性分析。</p><div class="row"><button class="btn" data-a="susopen">填寫問卷</button></div></div>`:""}
<div class="steps"><button class="${V.rt==="wk"?"":"on"}" data-a="rt" data-i="ov">面試總覽（流程與逐字稿）</button><button class="${V.rt==="wk"?"on":""}" data-a="rt" data-i="wk">弱點分析</button></div>${V.rt==="wk"?vWk(r,all,idx,p):vOvw(r)}`}
function stageTimes(r){const first={};(r.log||[]).forEach(l=>{const st=r.res[l.qi]&&r.res[l.qi].st;if(st&&first[st]==null)first[st]=l.s});const ks=Object.keys(first).map(Number).sort((a,b)=>a-b),o={};ks.forEach((k,i)=>o[k]=(i<ks.length-1?first[ks[i+1]]:(r.dur||0))-first[k]);return o}
function vOvw(r){const sts=[...new Set(r.res.map(x=>x.st))],tm=stageTimes(r),mins=r.len==="quick"?15:30;
return`<div class="card${NC()}"><h3>各階段表現 ${NB(12)}</h3><div class="tbw"><table><tr><th>階段</th><th>題數</th><th>用時／預計</th><th>平均分數</th></tr>${sts.map(st=>{const xs=r.res.filter(x=>x.st===st),a=Math.round(xs.reduce((s,x)=>s+x.s,0)/xs.length);return`<tr><td>${st}. ${STG[st]||"—"}</td><td>${xs.length}</td><td>${tm[st]!=null?mmss(tm[st]):"-"}／約 ${Math.max(1,Math.round(mins*xs.length/r.res.length))} 分</td><td><span class="tag ${a>=70?"g":""}">${a}</span></td></tr>`}).join("")}</table></div></div>
<div class="card"><h3>面試流程</h3><div class="tl">${r.res.map((x,i)=>`<div><b>Q${i+1}</b> <span class="tag">${esc(x.t)}</span><span class="tag ${x.s>=70?"g":""}">${x.s} 分</span>${x.src&&x.src!=="通用"?`<span class="tag w">${esc(x.src)}</span>`:""}${(x.turns||[]).length>1?`<span class="tag">追問 ${x.turns.length-1} 次</span>`:""}<br>${esc(x.q)}<div class="bar" style="margin-top:4px"><i style="width:${x.s}%"></i></div></div>`).join("")}</div></div>
<div class="card"><details><summary style="cursor:pointer;font-weight:600">完整逐字稿（${(r.log||[]).length} 則，含 AI 追問判斷）${NB(15)}</summary>${(r.log||[]).map(l=>l.r==="sys"?`<div class="tr" style="margin-top:10px"><b style="color:var(--mut)">── ${esc(l.t)} ──</b></div>`:`<div class="tr"><span class="mut">${mmss(l.s||0)}</span> <b>${l.r==="ai"?"面試官":"我"}</b>：${esc(l.t)}${l.why?`<div class="why">↳ AI 判斷：${esc(l.why)}</div>`:""}</div>`).join("")||"<small>此筆紀錄沒有逐字稿</small>"}</details></div>`}
function dimRow(k,v){v=nd(v);return`<div class="dim"><span style="font-size:12px">${k}</span><div class="bar"><i style="width:${v*20}%"></i></div><span>${v}/5</span></div>`}
function vWk(r,all,idx,p){const pr=all.slice(0,idx).reverse().find(z=>z.res&&z.res.length),agg={};
r.res.forEach((x,i)=>Object.entries(x.d||{}).forEach(([k,v])=>{(agg[k]=agg[k]||[]).push({v:nd(v),x,i})}));
const rows=Object.entries(agg).map(([k,arr])=>({k,avg:arr.reduce((a,b)=>a+b.v,0)/arr.length,w:arr.slice().sort((a,b)=>a.v-b.v)[0]})).sort((a,b)=>a.avg-b.avg),weak=rows.slice(0,rows.length>=3&&rows[2].avg<3.5?3:2);
const flags=[];r.res.forEach((x,i)=>(x.ev||[]).filter(e=>e.indexOf("⚠")===0).forEach(e=>flags.push(`Q${i+1}：${e.slice(2)}`)));
let h=`<div class="card${NC()}"><h3>最需要加強的維度 ${NB(16)}</h3>${weak.map(w=>{const s1=(w.w.x.a||"").split(/[。！？!?\n]/)[0];return`<div class="diff o" style="color:var(--ink)"><b>${esc(w.k)}</b>（平均 ${w.avg.toFixed(1)} / 5）<br><small class="mut">例證：Q${w.w.i+1}「${esc(cut(w.w.x.q,30))}」你說「${esc(cut(s1,34))}」</small><br>練習建議：${esc(SUGG[w.k]||"")}</div>`}).join("")}
<label style="margin-top:12px">六個評分維度（各 1～5 分）</label>${rows.slice().sort((a,b)=>DIMS.indexOf(a.k)-DIMS.indexOf(b.k)).map(x=>dimRow(x.k,Math.round(x.avg))).join("")}
<p class="n2" style="margin-top:8px">每題只計入相關維度。示範版以規則比對「好答案訊號」與「警訊」計分；正式版由 AI 依同一份題庫評分，並引用逐字稿原句。</p><div class="row"><button class="btn" data-a="step" data-i="3">前往弱點特訓（語音）</button></div></div>`;
if((r.gaps||[]).length)h+=`<div class="card${NC()}"><h3>技能落差 ${NB(14)}</h3><p style="margin:0;font-size:14px">JD 要求、但履歷沒有提到的技術：${r.gaps.map(g=>`<span class="tag">${esc(g)}</span>`).join("")}</p><p class="n2" style="margin:6px 0 0">依題庫規則，每場只問一題「你會怎麼追上」，不深挖細節。建議準備學習計畫，或補一個小型練習專案寫進履歷。</p></div>`;
if(flags.length)h+=`<div class="card${NC()}"><h3>警訊彙整 ${NB(16)}</h3>${flags.map(f=>`<div class="diff">${esc(f)}</div>`).join("")}</div>`;
return h+r.res.map((x,i)=>({x,i})).sort((a,b)=>a.x.s-b.x.s).map(({x,i})=>{const pv=pr&&pr.res.find(z=>z.id===x.id||z.q===x.q),comp=x.comp||T2C[x.t],sto=comp&&D.st.find(s=>s.comp===comp);
return`<div class="card"><h3>Q${i+1}｜${esc(x.q)}</h3><span class="tag">${x.s} 分</span><span class="tag">${esc(x.t)}</span>${x.src&&x.src!=="通用"?`<span class="tag w">${esc(x.src)}</span>`:""}${pv?`<span class="tag g">上次 ${pv.s} → 這次 ${x.s}</span>`:""}
${x.d?`<div style="margin:8px 0">${Object.entries(x.d).map(([k,v])=>dimRow(k,v)).join("")}</div>`:""}
${x.ev?`<div class="${NC()}" style="padding:4px 6px;margin:6px 0"><b style="font-size:13px">評分依據 ${NB(3)}</b>${x.ev.map(e=>`<div class="diff${e.indexOf("✓")===0?" n":""}">${esc(e)}</div>`).join("")}</div>`:""}
${(x.turns||[{q:x.q,a:x.a}]).map((t,j)=>`<div class="turn">${j?`<span class="qq">追問 ${j}：</span>${esc(t.q)}${t.why?`<div class="why">↳ AI 判斷：${esc(t.why)}</div>`:""}`:""}<div${j?' style="margin-top:2px"':""}><span class="mut">你的回答：</span>${esc(t.a||"（未作答）")}</div></div>`).join("")}
<div class="diff n">示範答案：${esc(x.m)}</div>
${x.s<70&&comp?`<div class="note${NC()}" style="margin-top:8px">${sto?`可以用故事庫的「${esc(sto.name)}」來回答這題：${esc(cut(sto.text.replace(/\n/g," "),48))}`:`故事庫還沒有「${comp}」類的故事，這是常見考題。<a class="lnk" data-a="ov" data-k="st" data-i="new" data-c="${comp}">新增「${comp}」故事</a>`} ${NB(7)}</div>`:""}
<div class="row"><button class="btn g s" data-a="tostory" data-i="${i}">將示範答案存入故事庫</button></div></div>`}).join("")}

function vDrill(p){const r=sessions(p)[0];if(!r)return`<div class="card">尚無弱點可練，請先完成一場模擬面試。</div>`;const n=simRecs(p).indexOf(r)+1;
let h=`<div class="card${NC()}"><h3>針對第 ${n} 次面試最弱的 3 題 ${NB(4)}</h3><p style="margin:0;font-size:14px">AI 重新提問，你用語音再答一次。<b>特訓分數只供練習，不會改變面試分數。</b>特訓完請回到「模擬面試」再做一次完整面試，該階段平均達 70 分，弱點才會標示為「已改善」。</p></div>`;
h+=r.res.map((x,i)=>({x,i})).filter(o=>o.x.st!==7).sort((a,b)=>a.x.s-b.x.s).slice(0,3).map(({x,i})=>{const key=r.id+"_"+i,g=UI.dres[key];
return`<div class="card"><h3>${esc(x.q)}</h3><span class="tag">${esc(x.t)}</span><span class="tag">面試時 ${x.s} 分</span><div class="row"><button class="btn g s" data-a="dspk" data-i="${i}">🔊 AI 重新提問</button><button class="mic" data-a="dmic" data-i="${i}" ${SR?"":"disabled"}>🎙</button><span class="mut" style="font-size:13px">${SR?"按麥克風口說回答":"不支援語音辨識，請直接輸入"}</span></div><textarea id="dr${i}" placeholder="語音辨識結果會出現在這裡，可以修改">${esc(UI.dans[key]||"")}</textarea><div class="row"><button class="btn" data-a="retry" data-i="${i}">送出練習</button></div>
${g?`<div class="diff n">練習分數：${g.s}（面試時 ${x.s}）</div>${g.ev.map(e=>`<div class="diff${e.indexOf("✓")===0?" n":""}">${esc(e)}</div>`).join("")}<div class="diff">示範答案：${esc(x.m)}</div>`:""}</div>`}).join("");
const dt=Object.entries(p.drill||{}).filter(([,id])=>id===r.id);
if(dt.length)h+=`<div class="card${NC()}"><h3>下一步：驗證進步 ${NB(4)}</h3>${dt.map(([t])=>chip(t,"特訓中・待驗證")).join("")}<div class="row"><button class="btn" data-a="step" data-i="1">再做一次完整面試</button></div></div>`;return h}

function vTrend(p){const all=simRecs(p),sc=all.filter(r=>r.score!=null);if(!sc.length)return`<div class="card">尚無資料，完成模擬面試後會顯示這個職缺的成長。</div>`;
const W=560,H=190,m=30,xs=i=>m+i*(W-2*m)/Math.max(1,sc.length-1),ys=v=>H-m-(Math.max(20,v)-20)*(H-2*m)/80;
const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><line x1="${m}" y1="${H-m}" x2="${W-m}" y2="${H-m}" stroke="var(--line)"/><line x1="${m}" y1="${ys(70)}" x2="${W-m}" y2="${ys(70)}" stroke="var(--ok)" stroke-dasharray="4 4"/><text x="${W-m}" y="${ys(70)-4}" text-anchor="end">70 分</text><polyline fill="none" stroke="var(--ac)" stroke-width="3" points="${sc.map((r,i)=>xs(i)+","+ys(r.score)).join(" ")}"/>${sc.map((r,i)=>`<circle cx="${xs(i)}" cy="${ys(r.score)}" r="4.5" fill="var(--ac2)"/><text x="${xs(i)}" y="${ys(r.score)-9}" text-anchor="middle">${r.score}</text><text x="${xs(i)}" y="${H-8}" text-anchor="middle">第${all.indexOf(r)+1}次</text>`).join("")}</svg>`;
const f=sc[0].score,l=sc[sc.length-1].score,e=Object.entries(tagStat(p));
return`<div class="card"><h3>${esc(p.co)}｜分數趨勢</h3>${svg}<p style="margin:4px 0 0">共 ${sc.length} 次練習，由 ${f} 分到 ${l} 分（${l-f>=0?"+":""}${l-f}）。</p></div><div class="card${NC()}"><h3>各階段分數與弱點狀態 ${NB(4)}</h3>${e.length?`<div class="tbw"><table><tr><th>面試階段</th><th>每次平均分數</th><th>狀態</th></tr>${e.map(([t,v])=>`<tr><td>${esc(t)}</td><td>${v.hist.join(" → ")}</td><td>${chip("",v.st)}</td></tr>`).join("")}</table></div>`:"<small>完成有逐題資料的模擬面試後會顯示</small>"}</div>`}

function vRv(p){const real=D.rec.filter(r=>r.pid===p.id&&r.type==="真實");
return`<div class="card${NC()}"><h3>記錄一場真實面試 ${NB(10)}</h3><div class="grid" style="gap:8px"><div><label>日期</label><input type="date" id="rdate" value="${today()}"></div><div><label>關卡</label><select id="rst"><option>一面</option><option>二面</option><option>最終面</option><option>其他</option></select></div><div><label>結果</label><select id="rres"><option>等待中</option><option>進入下一關</option><option>錄取</option><option>未錄取</option></select></div></div><label>被問到的題目（每行一題，會加入題庫）</label><textarea id="rv"></textarea><label>心得或被刷原因（選填）</label><input id="rvn"><div class="row"><button class="btn" data-a="rv">儲存紀錄並更新題庫</button></div></div>
<div class="card${NC()}"><h3>題庫 ${NB(10)}</h3><p class="n2">最近 2 題會出現在下一次模擬面試。</p>${(p.bank||[]).map((b,i)=>`<div class="diff" style="display:flex;gap:8px"><span style="flex:1">${esc(b.q)} <small class="mut">${esc(b.stage||"")}｜${b.date}</small>${i>=p.bank.length-2?' <span class="tag w">下次會考</span>':""}</span><a class="lnk mut" data-a="delbank" data-i="${i}">刪除</a></div>`).join("")||'<small class="mut">尚無題目</small>'}</div>
<div class="card"><h3>真實面試紀錄</h3>${real.map(r=>`<div class="diff">${r.date}｜${esc(r.stage||"")}｜<span class="tag ${r.result==="錄取"||r.result==="進入下一關"?"g":r.result==="未錄取"?"":"w"}">${esc(r.result||"已記錄")}</span>${r.note?"｜"+esc(r.note):""}</div>`).join("")||'<small class="mut">尚無紀錄</small>'}</div>`}

function vOv(){const o=UI.ov,arr=o.k==="cv"?D.cv:D.st,x=arr.find(z=>z.id===o.id)||{name:"",text:"",comp:o.c||COMP[0]};
return`<div class="ov"><div class="card" style="max-width:540px"><h3>${o.k==="cv"?"履歷版本":"故事（STAR）"}</h3><label>名稱</label><input id="o_n" value="${esc(x.name)}">${o.k==="st"?`<label>能力類別 ${NB(7)}</label><select id="o_c">${COMP.map(c=>`<option ${c===(x.comp||o.c)?"selected":""}>${c}</option>`).join("")}</select>`:""}<label>內容</label><textarea id="o_t" style="min-height:180px" placeholder="【情境】&#10;【任務】&#10;【行動】&#10;【結果】">${esc(x.text)}</textarea><div class="row"><button class="btn" data-a="osave">儲存</button><button class="btn g" data-a="oclose">關閉</button></div></div></div>`}
function vSus(){return`<div class="ov"><div class="card" style="max-width:580px;max-height:88vh;overflow:auto"><h3>易用性問卷（SUS）${NB(9)}</h3><p class="n2">1 = 非常不同意，5 = 非常同意。約 1 分鐘。</p>${SUS.map((s,i)=>`<div class="lk"><span>${i+1}. ${s}</span>${[1,2,3,4,5].map(v=>`<label><input type="radio" name="s${i}" value="${v}"><br>${v}</label>`).join("")}</div>`).join("")}<label>其他回饋（選填，請勿填寫個人資料）</label><textarea id="scm"></textarea><div class="row"><button class="btn" data-a="susok">送出</button><button class="btn g" data-a="susx">稍後再填</button></div></div></div>`}
function vCL(){const s=UI.cl;return`<div class="ov"><div class="card" style="max-width:680px;max-height:88vh;overflow:auto"><div class="row" style="justify-content:space-between;margin:0"><h3 style="margin:0">本版更新說明（相較前一版 demo）</h3><button class="btn g s" data-a="clx">關閉</button></div><p class="n2" style="margin-top:6px">共 ${CL.length-1} 項。第 1～11 項對應先前整理的 11 項改善建議；第 12～17 項依《AI 面試官提問題庫：後端工程師》做成完整面試流程。畫面上的藍色「新 N」標籤與虛線框，代表該處是本版新增或改動，點標籤可以回到這裡看說明。</p><label class="ck"><input type="checkbox" data-a="togglenew" ${UI.showNew?"checked":""}> 在畫面上顯示「新 N」標籤與虛線框</label>${CL.slice(1).map((c,j)=>`${CLG[j+1]?`<div class="clh">${CLG[j+1]}</div>`:""}<div class="cli${s===j+1?" sel":""}" id="cl${j+1}"><b><span class="nb" style="margin:0 6px 0 0">新 ${j+1}</span>${c.t}</b><div class="diff o">前一版：${c.b}</div><div class="diff n">本版：${c.a}</div><small class="mut">在哪裡看：${c.w}</small></div>`).join("")}</div></div>`}

function render(){let h=!U?vLogin():!D.consent?vConsent():V.v==="proj"?vProj():vHome();
if(U&&D&&D.consent){if(UI.ov)h+=vOv();if(UI.sus)h+=vSus()}
if(UI.cl!==null)h+=vCL();
h+=`<button class="fab" data-a="cl" data-i="0">本版更新 ${CL.length-1} 項${UI.showNew?"":"（標示已隱藏）"}</button>`;
$("#app").innerHTML=h;netBan();
